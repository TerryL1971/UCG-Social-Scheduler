<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - UCG Social Scheduler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    
    h1 {
      font-size: 28px;
      color: #111827;
      margin-bottom: 12px;
    }
    
    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    .retry-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    
    .retry-btn:hover {
      background: #b91c1c;
    }
    
    .retry-btn:active {
      transform: scale(0.98);
    }
    
    .status {
      margin-top: 24px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 14px;
      color: #6b7280;
    }
    
    .status.online {
      background: #dcfce7;
      color: #166534;
    }
    
    @media (max-width: 640px) {
      .container {
        padding: 32px 24px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Don't worry, your data is safe. 
      We'll automatically reconnect when you're back online.
    </p>
    
    <button class="retry-btn" onclick="retry()">
      Retry Connection
    </button>
    
    <div class="status" id="status">
      Checking connection...
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    
    function updateStatus() {
      if (navigator.onLine) {
        statusEl.textContent = 'Connected! Reloading...';
        statusEl.className = 'status online';
        setTimeout(function() {
          window.location.reload();
        }, 1000);
      } else {
        statusEl.textContent = 'Still offline';
        statusEl.className = 'status';
      }
    }
    
    function retry() {
      statusEl.textContent = 'Checking connection...';
      statusEl.className = 'status';
      
      fetch('/api/health', { method: 'HEAD' })
        .then(function() {
          statusEl.textContent = 'Connected! Reloading...';
          statusEl.className = 'status online';
          setTimeout(function() {
            window.location.href = '/dashboard';
          }, 1000);
        })
        .catch(function() {
          statusEl.textContent = 'Still offline. Please check your connection.';
          statusEl.className = 'status';
        });
    }
    
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    setTimeout(updateStatus, 1000);
  </script>
</body>
</html>
